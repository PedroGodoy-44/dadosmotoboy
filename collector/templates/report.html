<!doctype html><html lang=pt-BR><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<meta name=robots content="noindex,nofollow">
<title>Motoboys</title><link rel=stylesheet href=vendor/leaflet.css><style>
*{box-sizing:border-box}body{margin:0;background:#0f1115;color:#e6e8ee;
font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;padding:24px}
h1{font-size:20px;margin:0 0 4px}.s{color:#8b93a7;font-size:13px;margin-bottom:16px}
.card{background:#171a21;border:1px solid #242835;border-radius:10px;padding:16px;margin:16px 0}
.k{display:flex;gap:12px;flex-wrap:wrap}.kp{background:#171a21;border:1px solid #242835;
border-radius:10px;padding:12px 16px;min-width:120px}.kp b{display:block;font-size:22px;color:#fff}
.kp span{color:#8b93a7;font-size:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:#8b93a7;font-weight:500;padding:6px 8px;font-size:11px;
text-transform:uppercase;border-bottom:1px solid #242835}
td{padding:6px 8px;border-bottom:1px solid #1c2029}
.g{display:flex;gap:2px}.c{width:14px;height:20px;border-radius:2px}
.nm{white-space:nowrap;max-width:190px;overflow:hidden;text-overflow:ellipsis}
.bad{color:#ff6b6b}.ok{color:#51cf66}.wr{color:#ffd43b}
select{background:#171a21;color:#e6e8ee;border:1px solid #242835;border-radius:6px;padding:6px 10px}
.lg{color:#5b6478;font-size:11px;margin-top:8px}
/* ── abas ─────────────────────────────────────────────────────────── */
.tabs{display:flex;gap:4px;margin:0 0 12px}
.tab{background:none;border:0;border-bottom:2px solid transparent;color:#8b93a7;
font:inherit;padding:8px 14px;cursor:pointer;border-radius:6px 6px 0 0}
.tab:hover{color:#e6e8ee}.tab[aria-selected=true]{color:#fff;border-bottom-color:#4c6ef5}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
/* ── mapa ─────────────────────────────────────────────────────────── */
#map{height:520px;border-radius:8px;background:#1c2029}
.leaflet-container{font:inherit}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{display:flex;align-items:center;gap:8px;background:#12151b;border:1px solid #242835;
color:#8b93a7;border-radius:999px;padding:6px 14px 6px 10px;cursor:pointer;font:inherit;font-size:13px}
.chip:hover{border-color:#39414f}.chip[aria-pressed=true]{color:#fff;border-color:#4c5670}
.sw{width:10px;height:10px;border-radius:50%;background:#39414f;flex:none}
.chip[aria-pressed=true] .sw{box-shadow:0 0 0 3px rgba(255,255,255,.12)}
.chip small{color:#5b6478}.chip[aria-pressed=true] small{color:#8b93a7}
.rot{color:#ffd43b;font-size:12px;min-height:18px}
.lbl{background:rgba(255,255,255,.92);border-radius:4px;padding:1px 6px;font-size:11px;
font-weight:600;color:#14171f;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.35)}
/* ── relatorio ────────────────────────────────────────────────────── */
.btn{background:#2a3242;color:#e6e8ee;border:1px solid #3d4658;border-radius:6px;
padding:6px 14px;font:inherit;cursor:pointer}.btn:hover{background:#333c4e}
.bar-h{background:#4c6ef5;height:10px;border-radius:2px;min-width:2px;display:inline-block;
vertical-align:middle}
.tot td{font-weight:700;border-top:2px solid #2f3646;border-bottom:0}
.cab{display:none}
@media print{
  /* o tema escuro imprime um retangulo preto e come tinta: vira papel branco */
  @page{margin:14mm}
  body{background:#fff;color:#000;padding:0;font-size:11pt}
  .tabs,.bar,.chips,.rot,.btn,#app,#mapa,.noprint{display:none!important}
  .cab{display:block;margin-bottom:10mm;border-bottom:2px solid #000;padding-bottom:4mm}
  .cab h2{margin:0 0 2mm;font-size:15pt}.cab div{color:#444;font-size:9pt}
  .card{background:#fff;border:0;border-radius:0;padding:0;margin:0 0 8mm;
        break-inside:avoid}
  h1,.s{display:none}
  th{color:#000;border-bottom:1.5px solid #000;font-size:8pt}
  td{border-bottom:1px solid #ddd}
  .kp{border:1px solid #999;background:#fff}.kp b{color:#000}.kp span{color:#444}
  .ok,.wr,.bad{color:#000}
  .lg{color:#555}
  /* sem isto o Chrome/Firefox descartam os fundos e a barra some do papel */
  .bar-h{background:#333!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  table{break-inside:auto}tr{break-inside:avoid}thead{display:table-header-group}
}
</style></head><body>
<h1>Presenca real de motoboys</h1><div class=s id=s></div>
<div class=tabs role=tablist>
<button class=tab id=t-presenca role=tab aria-selected=true>Presenca</button>
<button class=tab id=t-mapa role=tab aria-selected=false>Mapa</button>
<button class=tab id=t-rel role=tab aria-selected=false>Relatorio</button></div>
<div class=bar id=barra><select id=sel></select><span class=lg id=ctx></span></div>
<div class=bar id=barra-rel hidden>
  <label class=lg for=de>de</label><select id=de></select>
  <label class=lg for=ate>ate</label><select id=ate></select>
  <button class=btn id=imprimir>Imprimir</button></div>
<div id=app></div>
<div id=mapa hidden>
  <div class=chips id=chips></div><div class=rot id=rot></div>
  <div class=card style=padding:8px><div id=map></div></div>
  <div id=mstats></div>
</div>
<div id=rel hidden></div>
<script src=vendor/leaflet.js></script>
<script>const P=__DATA__;
function cor(v){if(v==null)return"#1c2029";if(v>=90)return"#2f9e44";if(v>=60)return"#66a80f";
if(v>=30)return"#e8590c";if(v>0)return"#c92a2a";return"#1c2029"}
function R(d){const r=P.dias[d],a=document.getElementById("app");
if(!r){a.innerHTML="<div class=card>Sem dados.</div>";return}
/* Sem "ocupacao" e sem "horas rodando" separadas de "horas online": o painel
   so lista quem tem pedido em maos, entao as duas contam os mesmos snapshots
   e a razao seria 100% por construcao. Ver o comentario em agregar(). */
const th=r.motoboys.reduce((s,m)=>s+m.horas,0),
tp=r.motoboys.reduce((s,m)=>s+m.pedidos,0),
tk=Object.values(r.trajetos||{}).reduce((s,t)=>s+t.km,0);
let h=`<div class=k>
<div class=kp><b>${r.motoboys.length}</b><span>motoboys</span></div>
<div class=kp><b>${th.toFixed(1)}h</b><span>horas com pedido</span></div>
<div class=kp><b>${tp}</b><span>pedidos</span></div>
<div class=kp><b>${tk.toFixed(0)} km</b><span>distancia</span></div>
<div class=kp><b>${Math.round(r.snapshots/Math.max(1,r.tentativas)*100)}%</b><span>cobertura coletor</span></div></div>`;
h+=`<div class=card><table><tr><th>Motoboy</th><th>Presenca 08h&rarr;23h</th><th>Turno</th>
<th>Horas c/ pedido</th><th>Ped</th><th>Distancia</th>${r.tem_escala?"<th>Aderencia</th>":""}</tr>`;
r.motoboys.forEach(m=>{let g="<div class=g>";
for(let i=8;i<=23;i++){const v=r.cobertura[i]>0?m.grid[i]:null;
g+=`<div class=c style="background:${cor(v)}" title="${i}h: ${v==null?"sem coleta":v+"%"}"></div>`}
g+="</div>";let ad="";if(r.tem_escala){const v=m.aderencia;
ad=`<td class="${v==null?"":v>=90?"ok":v>=60?"wr":"bad"}">${v==null?"-":v+"%"}</td>`}
const tn=m.inicio&&m.fim?`${m.inicio}&rarr;${m.fim}`:"-";
const km=(r.trajetos||{})[m.id];
h+=`<tr><td class=nm>${m.nome}</td><td>${g}</td><td>${tn}</td><td>${m.horas.toFixed(1)}</td>
<td>${m.pedidos}</td><td>${km?km.km.toFixed(1)+" km":"-"}</td>${ad}</tr>`});
h+=`</table><div class=lg>Verde = presente quase toda a hora - vermelho = presenca baixa -
cinza = sem coleta. <b>Horas c/ pedido</b> conta o tempo com ao menos uma entrega em maos:
o painel nao lista quem esta logado e ocioso, entao a espera por corrida nao entra aqui.</div></div>`;
const f=r.motoboys.filter(m=>m.faltou&&m.faltou.length);
if(f.length){h+=`<div class=card><h3 style="margin:0 0 10px;font-size:14px">Escala x real</h3>
<table><tr><th>Motoboy</th><th>Escaladas</th><th>Cumpridas</th><th>Faltou</th></tr>`;
f.forEach(m=>{h+=`<tr><td class=nm>${m.nome}</td><td>${m.escala_h}</td><td>${m.escala_ok}</td>
<td class=bad>${m.faltou.map(x=>String(x).padStart(2,"0")+"h").join(", ")}</td></tr>`});
h+="</table></div>"}
h+=`<div class=card><h3 style="margin:0 0 10px;font-size:14px">Presentes por hora</h3><table>`;
for(let i=8;i<=23;i++){const n=r.online_hora[i];if(n==null)continue;
h+=`<tr><td style=width:50px>${String(i).padStart(2,"0")}h</td><td>
<div style="background:#4c6ef5;height:14px;border-radius:3px;width:${Math.min(100,n*10)}%"></div></td>
<td style=width:50px>${n.toFixed(1)}</td></tr>`}
h+="</table></div>";a.innerHTML=h}

/* ─────────────────────────── ABA MAPA ───────────────────────────────
   Paleta validada com scripts/validate_palette.js no modo --pairs all
   (num mapa TODAS as trilhas ficam visiveis juntas, entao qualquer par
   precisa ser distinguivel — nao so os vizinhos de uma ordem fixa),
   contra a superficie clara dos tiles do OSM (#f2efe9):
     azul+laranja+aqua+violeta -> CVD dE 9.2 / visao normal 16.3  PASSA
     qualquer 5a cor           -> visao normal 12.9               FALHA
   Dai o teto de 4 trilhas simultaneas. Nao aumentar sem revalidar.
   Laranja e aqua ficam abaixo de 3:1 contra o tile: a "relief rule" e
   atendida pelo rotulo com o nome fixado no fim de cada trilha e pelo
   contorno branco da linha, que tambem e pratica cartografica padrao. */
const CORES=["#2a78d6","#eb6834","#1baf7a","#4a3aa7"],OUTRA="#6b7280",MAX=CORES.length;
let map=null,camadas=[],diaAtual=null;
const hhmm=m=>String(m/60|0).padStart(2,"0")+":"+String(m%60).padStart(2,"0");

/* A frota passa de 4 (chega a 10 num dia), entao slot fixo por posicao
   alfabetica deixaria a maioria em cinza. Em vez disso a cor gruda no
   motoboy ENQUANTO ele estiver na tela e o slot so e liberado quando ele
   sai. Isso preserva o que a regra "cor segue a entidade" protege: tirar
   um colega do mapa nunca repinta os que ficaram. */
const slots=new Map();                       // id -> indice de cor
function ocupar(id){if(slots.has(id))return true;
  const usados=new Set(slots.values());
  for(let i=0;i<MAX;i++)if(!usados.has(i)){slots.set(id,i);return true}
  return false}                              // sem slot livre = teto atingido
function corDe(id){const i=slots.get(id);return i==null?OUTRA:CORES[i]}
function idsDoDia(r){return Object.keys(r.trajetos||{})
  .sort((a,b)=>(r.trajetos[a].nome||"").localeCompare(r.trajetos[b].nome||""))}

function desenhar(){const r=P.dias[diaAtual];
camadas.forEach(c=>map.removeLayer(c));camadas=[];
const rot=document.getElementById("rot"),st=document.getElementById("mstats");
if(!r||!r.trajetos||!Object.keys(r.trajetos).length){
  rot.textContent="Sem posicoes registradas neste dia.";st.innerHTML="";return}
rot.textContent=slots.size>=MAX?`Maximo de ${MAX} trilhas ao mesmo tempo — desmarque uma para trocar.`:"";
const caixa=[];
idsDoDia(r).filter(id=>slots.has(id)).forEach(id=>{
  const t=r.trajetos[id],pts=t.pontos.map(p=>[p[1],p[2]]);
  if(!pts.length)return;
  caixa.push(...pts);
  const c=corDe(id);
  /* contorno branco por baixo: separa a trilha do tile e das outras trilhas */
  camadas.push(L.polyline(pts,{color:"#fff",weight:6,opacity:.85}).addTo(map));
  const ln=L.polyline(pts,{color:c,weight:3,opacity:.95}).addTo(map);
  ln.bindTooltip(`${t.nome} — ${t.km.toFixed(1)} km`,{sticky:true});
  camadas.push(ln);
  const ini=t.pontos[0],fim=t.pontos[t.pontos.length-1];
  camadas.push(L.circleMarker([ini[1],ini[2]],{radius:5,color:"#fff",weight:2,
    fillColor:c,fillOpacity:1}).bindTooltip(`${t.nome} — inicio ${hhmm(ini[0])}`).addTo(map));
  camadas.push(L.circleMarker([fim[1],fim[2]],{radius:8,color:"#fff",weight:3,
    fillColor:c,fillOpacity:1}).bindTooltip(`${t.nome} — ultimo ${hhmm(fim[0])}`).addTo(map));
  /* rotulo direto: identidade nunca depende so da cor */
  camadas.push(L.marker([fim[1],fim[2]],{icon:L.divIcon({className:"",
    html:`<span class=lbl>${t.nome.split(" ")[0]}</span>`,iconAnchor:[-10,8]})}).addTo(map));
});
if(caixa.length)map.fitBounds(L.latLngBounds(caixa).pad(.15));
const linhas=idsDoDia(r).filter(id=>slots.has(id)).map(id=>{const t=r.trajetos[id],
  m=(r.motoboys||[]).find(x=>x.id===id)||{};
  return `<tr><td><span class=sw style="display:inline-block;background:${corDe(id)}"></span></td>
  <td class=nm>${t.nome}</td><td>${t.km.toFixed(1)} km</td>
  <td>${m.horas!=null?m.horas.toFixed(1)+" h":"-"}</td>
  <td>${hhmm(t.pontos[0][0])}&rarr;${hhmm(t.pontos[t.pontos.length-1][0])}</td>
  <td>${t.pontos.length}</td></tr>`}).join("");
/* a mesma informacao em tabela: exigido pela regra de contraste e serve de
   fallback para impressao, onde a trilha colorida se perde */
st.innerHTML=linhas?`<div class=card><table><tr><th></th><th>Motoboy</th><th>Distancia</th>
<th>Horas c/ pedido</th><th>Periodo</th><th>Pontos</th></tr>${linhas}</table>
<div class=lg>Distancia soma deslocamentos entre 60 m e 5 km por intervalo de 3 min —
abaixo disso e tremido de GPS parado, acima e buraco de coleta.</div></div>`:"";}

function chips(){const r=P.dias[diaAtual],el=document.getElementById("chips");
if(!r||!r.trajetos){el.innerHTML="";return}
el.innerHTML=idsDoDia(r).map(id=>{const t=r.trajetos[id],on=slots.has(id);
return `<button class=chip data-id="${id}" aria-pressed="${on}">
<span class=sw style="background:${on?corDe(id):"#39414f"}"></span>
${t.nome}<small>${t.km.toFixed(1)} km</small></button>`}).join("");
el.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{const id=b.dataset.id;
  if(slots.has(id))slots.delete(id);
  else if(!ocupar(id)){document.getElementById("rot").textContent=
    `Maximo de ${MAX} trilhas ao mesmo tempo — desmarque uma para trocar.`;return}
  chips();desenhar()})}

function abrirMapa(){if(!map){map=L.map("map",{scrollWheelZoom:false});
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,
  attribution:'&copy; <a href="https://openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(map);
map.setView([-21.37,-46.52],13)}
/* o container ficou com altura 0 enquanto a aba estava escondida */
setTimeout(()=>map.invalidateSize(),0);desenhar()}

function trocarDia(d){diaAtual=d;R(d);
const r=P.dias[d];slots.clear();
/* padrao = os que mais rodaram no dia; num dia de 10 motoboys eles sao a
   resposta mais provavel de quem abre o mapa */
Object.keys((r||{}).trajetos||{})
  .sort((a,b)=>r.trajetos[b].km-r.trajetos[a].km).slice(0,MAX).forEach(ocupar);
chips();if(map&&!document.getElementById("mapa").hidden)abrirMapa();}

/* ───────────────────────── ABA RELATORIO ────────────────────────────
   Consolida o periodo escolhido a partir dos mesmos dias ja embutidos na
   pagina — nenhuma consulta, nenhum servidor. */
function agregar(de,ate){
const dias=Object.keys(P.dias).filter(d=>d>=de&&d<=ate).sort();
const por=new Map();let snaps=0,tent=0;
dias.forEach(d=>{const r=P.dias[d];snaps+=r.snapshots;tent+=r.tentativas;
  (r.motoboys||[]).forEach(m=>{
    const a=por.get(m.id)||{id:m.id,nome:m.nome,horas:0,rodando:0,pedidos:0,km:0,dias:0};
    a.nome=m.nome;a.horas+=m.horas;a.rodando+=m.h_rodando;a.pedidos+=m.pedidos;a.dias++;
    const t=(r.trajetos||{})[m.id];if(t)a.km+=t.km;
    por.set(m.id,a)})});
const linhas=[...por.values()].sort((x,y)=>y.horas-x.horas);
const tot=linhas.reduce((s,a)=>({horas:s.horas+a.horas,rodando:s.rodando+a.rodando,
  pedidos:s.pedidos+a.pedidos,km:s.km+a.km}),{horas:0,rodando:0,pedidos:0,km:0});
/* NAO ha metrica de ocupacao aqui, de proposito. O painel so lista o motoboy
   enquanto ele tem pedido em maos (verificado: nenhum snapshot com
   qt_pedidos=0 em 3286, e o motoboy some da lista nos intervalos ociosos),
   entao "horas rodando" e "horas online" contam os MESMOS snapshots e a razao
   entre elas da 100% sempre. Seria uma identidade matematica vestida de KPI.
   Medir ociosidade exige outro nrOperacao do painel, que liste tambem quem
   esta logado sem corrida. */
linhas.forEach(a=>a.pedDia=a.dias?a.pedidos/a.dias:0);
return{dias,linhas,tot,snaps,tent}}

function relatorio(){const de=document.getElementById("de").value,
ate=document.getElementById("ate").value,el=document.getElementById("rel");
if(de>ate){el.innerHTML=`<div class=card>Periodo invalido: "de" e depois de "ate".</div>`;return}
const g=agregar(de,ate);
if(!g.dias.length){el.innerHTML="<div class=card>Sem dados no periodo.</div>";return}
const per=g.dias.length===1?fmt(g.dias[0]):`${fmt(g.dias[0])} a ${fmt(g.dias[g.dias.length-1])}`;
const cob=Math.round(g.snaps/Math.max(1,g.tent)*100);
const maxr=Math.max(...g.linhas.map(a=>a.rodando),1);
let h=`<div class=cab><h2>Relatorio de presenca — motoboys</h2>
<div>Periodo: ${per} (${g.dias.length} dia${g.dias.length>1?"s":""}) &middot;
gerado em ${P.gerado_em}</div></div>`;
h+=`<div class=k>
<div class=kp><b>${g.linhas.length}</b><span>motoboys no periodo</span></div>
<div class=kp><b>${g.tot.horas.toFixed(0)}h</b><span>horas com pedido</span></div>
<div class=kp><b>${g.tot.pedidos}</b><span>pedidos entregues</span></div>
<div class=kp><b>${g.tot.km.toFixed(0)} km</b><span>distancia total</span></div>
<div class=kp><b>${cob}%</b><span>cobertura do coletor</span></div></div>`;
h+=`<div class=card><table><thead><tr><th>Motoboy</th><th>Dias</th><th>Horas com pedido</th>
<th></th><th>Pedidos</th><th>Pedidos/dia</th><th>Distancia</th></tr></thead><tbody>`;
g.linhas.forEach(a=>{h+=`<tr><td class=nm>${a.nome}</td><td>${a.dias}</td>
<td>${a.horas.toFixed(1)}</td>
<td style=width:110px><span class=bar-h style="width:${Math.round(a.horas/maxr*100)}px"></span></td>
<td>${a.pedidos}</td><td>${a.pedDia.toFixed(1)}</td><td>${a.km.toFixed(1)} km</td></tr>`});
h+=`<tr class=tot><td>TOTAL</td><td>${g.dias.length}</td><td>${g.tot.horas.toFixed(1)}</td>
<td></td><td>${g.tot.pedidos}</td>
<td>${g.dias.length?(g.tot.pedidos/g.dias.length).toFixed(1):"0"}</td>
<td>${g.tot.km.toFixed(1)} km</td></tr></tbody></table>
<div class=lg><b>Horas com pedido</b> conta o tempo em que o motoboy aparecia no painel
com ao menos uma entrega em maos. O painel nao lista quem esta logado e ocioso, entao o
tempo de espera por corrida <b>nao esta medido aqui</b> — estes numeros sao piso, nao
jornada total. Distancia descarta deslocamentos abaixo de 60 m (GPS parado) e acima de
5 km por intervalo de 3 min (buraco de coleta).</div></div>`;
h+=`<div class=card><h3 style="margin:0 0 10px;font-size:14px">Por dia</h3>
<table><thead><tr><th>Dia</th><th>Motoboys</th><th>Horas com pedido</th><th>Pedidos</th>
<th>Distancia</th><th>Cobertura do coletor</th></tr></thead><tbody>`;
g.dias.slice().reverse().forEach(d=>{const r=P.dias[d],
  ho=r.motoboys.reduce((s,m)=>s+m.horas,0),pe=r.motoboys.reduce((s,m)=>s+m.pedidos,0),
  qm=Object.values(r.trajetos||{}).reduce((s,t)=>s+t.km,0),
  c=Math.round(r.snapshots/Math.max(1,r.tentativas)*100);
h+=`<tr><td>${fmt(d)}</td><td>${r.motoboys.length}</td><td>${ho.toFixed(1)}</td>
<td>${pe}</td><td>${qm.toFixed(1)} km</td>
<td class="${c>=95?"ok":c>=80?"wr":"bad"}">${c}%</td></tr>`});
h+=`</tbody></table><div class=lg>Cobertura = snapshots obtidos / tentativas de coleta.
Abaixo de 100% houve falha de coleta, e as horas do dia estao subestimadas.</div></div>`;
el.innerHTML=h}
const fmt=d=>d.split("-").reverse().join("/");

function aba(nome){
const alvo={presenca:"app",mapa:"mapa",rel:"rel"};
for(const[k,v]of Object.entries(alvo))document.getElementById(v).hidden=(k!==nome);
for(const k of Object.keys(alvo))
  document.getElementById("t-"+(k==="presenca"?"presenca":k)).setAttribute("aria-selected",k===nome);
document.getElementById("barra").hidden=(nome==="rel");
document.getElementById("barra-rel").hidden=(nome!=="rel");
document.getElementById("ctx").textContent=nome==="mapa"
  ?"Trilhas do dia — ate 4 ao mesmo tempo":"";
if(nome==="mapa")abrirMapa();
if(nome==="rel")relatorio()}

(function(){const ds=Object.keys(P.dias).sort().reverse();
document.getElementById("s").textContent=`gerado ${P.gerado_em} - ${ds.length} dia(s)`;
const s=document.getElementById("sel");
s.innerHTML=ds.map(d=>`<option value="${d}">${d}</option>`).join("");
s.onchange=()=>trocarDia(s.value);
const asc=ds.slice().reverse(),op=asc.map(d=>`<option value="${d}">${fmt(d)}</option>`).join("");
const de=document.getElementById("de"),ate=document.getElementById("ate");
de.innerHTML=op;ate.innerHTML=op;de.value=asc[0];ate.value=asc[asc.length-1];
de.onchange=ate.onchange=relatorio;
document.getElementById("imprimir").onclick=()=>window.print();
document.getElementById("t-presenca").onclick=()=>aba("presenca");
document.getElementById("t-mapa").onclick=()=>aba("mapa");
document.getElementById("t-rel").onclick=()=>aba("rel");
trocarDia(ds[0])})();</script></body></html>
