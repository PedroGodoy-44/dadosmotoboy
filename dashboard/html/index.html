function R(d){const r=P.dias[d],a=document.getElementById("app");

<div class=kp><b>${th?Math.round(tr/th*100):0}%</b><span>ocupacao media</span></div>

h+=`<div class=card><table><tr><th>Motoboy</th><th>Presenca 08h&rarr;23h</th><th>Turno</th><th>Horas</th>

r.motoboys.forEach(m=>{let g="<div class=g>";
for(let i=8;i<=23;i++){const v=r.cobertura[i]>0?m.grid[i]:null;

g+="</div>";let ad="";if(r.tem_escala){const v=m.aderencia;
