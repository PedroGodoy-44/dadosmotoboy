function R(d){const r=P.dias[d],a=document.getElementById("app");
if(!r){a.innerHTML="<div class=card>Sem dados.</div>";return}
const th=r.motoboys.reduce((s,m)=>s+m.horas,0),tr=r.motoboys.reduce((s,m)=>s+m.h_rodando,0);

<div class=kp><b>${th?Math.round(tr/th*100):0}%</b><span>ocupacao media</span></div>

g+="</div>";let ad="";if(r.tem_escala){const v=m.aderencia;
ad=`<td class="${v==null?"":v>=90?"ok":v>=60?"wr":"bad"}">${v==null?"-":v+"%"}</td>`}
const tn=m.inicio&&m.fim?`${m.inicio}&rarr;${m.fim}`:"-";

<td>${m.h_rodando.toFixed(1)}</td><td class="${m.ocupacao>=50?"ok":m.ocupacao>=25?"wr":"bad"}">${m.ocupacao}%</td>
<td>${m.pedidos}</td>${ad}</tr>`});

if(f.length){h+=`<div class=card><h3 style="margin:0 0 10px;font-size:14px">Escala x real</h3>

f.forEach(m=>{h+=`<tr><td class=nm>${m.nome}</td><td>${m.escala_h}</td><td>${m.escala_ok}</td>
